{c:"errors",t:"err",n:"Assertion failed: … / Fatal error!",d:"A `check` fired. The condition in the message tells you what was assumed; the callstack right below points at the caller. Search the log for 'Assertion failed'. Common: a null pointer passed into an engine function, an index out of bounds on a TArray, a UObject used after GC.",g:["check","crash","callstack","fatal"]},
{c:"errors",t:"err",n:"Ensure condition failed",d:"A non-fatal `ensure`. The game continues but something was in an unexpected state; it logs once per site unless it is `ensureAlways`. Find 'Ensure condition failed' in the log for the callstack.",g:["ensure","warning","callstack"]},
{c:"errors",t:"err",n:"LNK2019: unresolved external symbol",d:"Three usual causes: the module that owns the symbol is missing from `PublicDependencyModuleNames` in your Build.cs (UMG, Slate, SlateCore, AIModule, NavigationSystem, EnhancedInput, GameplayAbilities, Niagara, ChaosVehicles…); your class lacks the `MYGAME_API` macro when used from another module; or you declared a function and never wrote the body.",g:["linker","build.cs","module","api macro","cpp"]},
{c:"errors",t:"err",n:"error C2027 / C2039: use of undefined type",d:"You forward-declared a class and then used its members. Add the real `#include` in the .cpp. Unity builds often hide this until a clean build or a different configuration.",g:["include","forward declaration","unity build","cpp"]},
{c:"errors",t:"err",n:"Live Coding: patch failed / no changes applied",d:"Header changes, new UPROPERTY or UFUNCTION declarations, and changed class layouts are outside what Live Coding can patch. Close the editor, build from the IDE, reopen. If it keeps failing on trivial .cpp edits, delete the Intermediate folder and regenerate project files.",g:["live coding","header","compile","intermediate"]},
{c:"errors",t:"err",n:"Failed to load package / Failed to find object / redirector",d:"An asset was moved or renamed outside the editor, or a redirector was left behind. Right-click the folder in the Content Browser > Fix Up Redirectors; use the Reference Viewer to find who still points at the old path. `Log LogLinker Verbose` names the missing package.",g:["redirector","missing asset","package","loglinker"]},
{c:"errors",t:"err",n:"Packaging failed: UATHelper … Error",d:"Scroll up in the Output Log to the first line containing 'Error:'; everything after it is fallout. Usual suspects: a Blueprint that does not compile, a map missing from Project Settings > Packaging > List of maps to include, a shader compile failure, or a plugin not built for the target. Deleting Saved and Intermediate and running Validate Assets on the Content folder fixes most stubborn cases.",g:["packaging","cook","uat","build failed"]},
{c:"errors",t:"err",n:"Texture streaming pool over budget",d:"More texture data is visible than the pool allows, so mips stay low. Raise `r.Streaming.PoolSize`, lower texture resolutions or assign LOD Groups, and check `stat streaming` for the worst offenders.",g:["streaming","pool size","blurry","textures"]},
{c:"errors",t:"err",n:"Low FPS only in the editor",d:"Editor Preferences > General > Performance: turn off Use Less CPU When in Background if you alt-tab while profiling; realtime viewports and open Blueprint editors all cost frame time. The number that matters comes from a Standalone or packaged build.",g:["editor","fps","performance","standalone"]},
{c:"errors",t:"err",n:"Works in PIE but not in the packaged build",d:"Usually an editor-only dependency: `WITH_EDITOR` code, an Editor Utility asset referenced at runtime, an asset the cook skipped because nothing hard-references it (add its folder to Additional Asset Directories to Cook), or a Blueprint warning that became fatal. Test in Standalone first, then read the cook log.",g:["packaged","cook","editor only","missing asset"]}
];

</script>
<script>
(function(){
"use strict";
const CATS=[
 {id:"all",l:"Everything"},
 {id:"general",l:"Editor & console"},
 {id:"profiling",l:"Profiling"},
 {id:"rendering",l:"Rendering & materials"},
 {id:"blueprint",l:"Blueprint"},
 {id:"cpp",l:"C++"},
 {id:"gameplay",l:"Gameplay & input"},
 {id:"ui",l:"UI (UMG & Slate)"},
 {id:"animation",l:"Animation"},
 {id:"physics",l:"Physics & vehicles"},
 {id:"networking",l:"Networking"},
 {id:"ai",l:"AI & navigation"},
 {id:"audio",l:"Audio"},
 {id:"errors",l:"Common errors"}
];
const TYPES={
 cmd:{l:"Console command",v:"var(--cmd)"},
 tip:{l:"Tip",v:"var(--tip)"},
 howto:{l:"How-to",v:"var(--howto)"},
 code:{l:"C++ snippet",v:"var(--code)"},
 key:{l:"Shortcut",v:"var(--key)"},
 arg:{l:"Launch argument",v:"var(--arg)"},
 err:{l:"Error",v:"var(--err)"}
};
const CAT_LABEL=Object.fromEntries(CATS.map(c=>[c.id,c.l]));
const PRIMERS={
 all:'<p>Everything below is one long, filterable list. Search matches titles, commands, descriptions and tags; pick a category on the left or a type below to narrow it. Press <span class="kbd">/</span> from anywhere to jump to the search box.</p>',
 general:'<p>Open the in-game console with <code>`</code> (the key left of 1; <code>~</code> on many layouts). Press it twice for the full log drawer. Tab autocompletes, and typing a prefix such as <code>stat </code> or <code>r.Lumen.</code> then Tab lists every command under it. Most cheats and stat displays are compiled out of Shipping builds — use the Test configuration when you need them in a packaged game.</p>',
 profiling:'<p>Start every performance investigation with <code>stat unit</code>. Whichever line is largest is the thread you are waiting on, and everything else on this page branches from that answer.</p><div class="overlay"><span class="m">Frame:</span> <span class="r">16.7 ms</span>   <span class="m">← the whole frame; ≈ the largest of the four below</span>\n<span class="m">Game: </span> <span class="r">14.2 ms</span>   <span class="m">← gameplay CPU: ticks, Blueprint, physics, animation</span>\n<span class="m">Draw: </span> <span class="g"> 6.1 ms</span>   <span class="m">← render thread: culling, draw-call setup</span>\n<span class="m">GPU:  </span> <span class="g"> 9.8 ms</span>   <span class="m">← shaders, resolution, post-process</span>\n<span class="m">RHIT: </span> <span class="g"> 2.3 ms</span>   <span class="m">← RHI thread submitting commands</span></div><p>In this example the game thread is the problem; a GPU trace would be wasted effort. Then measure in a packaged Development or Test build, not the editor.</p>',
 errors:'<p>Messages as they appear in the Output Log, Message Log or compiler, with the usual cause and the fix. Search for the distinctive part of the message.</p>'
};

const state={q:"",cat:"all",type:"all"};
const $=s=>document.querySelector(s);
const elCats=$("#cats"),elTypes=$("#types"),elList=$("#list"),elMeta=$("#meta"),elHero=$("#hero"),elQ=$("#q"),elBox=$("#searchbox");

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function inlineCode(s){return s.replace(/`([^`]+)`/g,"<code>$1</code>");}
function tokens(){return state.q.toLowerCase().split(/\s+/).filter(Boolean);}
function reFor(toks){if(!toks.length)return null;return new RegExp("("+toks.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");}
function highlight(html,re){if(!re)return html;return html.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,text)=>tag?tag:text.replace(re,"<mark>$1</mark>"));}

function score(e,toks){
  if(!toks.length)return 1;
  const n=e.n.toLowerCase(),k=(e.k||"").toLowerCase(),d=e.d.toLowerCase(),g=(e.g||[]).join(" ").toLowerCase();
  let s=0;
  for(const t of toks){
    let hit=0;
    if(n.includes(t)){hit+=n.startsWith(t)?14:10;}
    if(k.includes(t))hit+=7;
    if(g.includes(t))hit+=5;
    if(d.includes(t))hit+=1;
    if(!hit)return 0;
    s+=hit;
  }
  return s;
}

function matchesBase(e){return (state.cat==="all"||e.c===state.cat)&&(state.type==="all"||e.t===state.type);}

function render(){
  const toks=tokens(),re=reFor(toks);
  elBox.classList.toggle("has",state.q.length>0);

  // category counts for current query + type
  const counts={all:0};
  for(const c of CATS)counts[c.id]=0;
  const scored=[];
  DATA.forEach((e,i)=>{
    const s=score(e,toks);
    if(!s)return;
    if(state.type==="all"||e.t===state.type){counts.all++;counts[e.c]++;}
    if(matchesBase(e))scored.push({e,s,i});
  });
  scored.sort((a,b)=>b.s-a.s||a.i-b.i);

  elCats.innerHTML=CATS.map(c=>`<button class="cat${state.cat===c.id?" on":""}${counts[c.id]===0?" zero":""}" data-cat="${c.id}" aria-pressed="${state.cat===c.id}"><span>${c.l}</span><span class="n">${counts[c.id]}</span></button>`).join("");

  const typeCounts={all:0};
  for(const t in TYPES)typeCounts[t]=0;
  DATA.forEach(e=>{if((state.cat==="all"||e.c===state.cat)&&score(e,toks)){typeCounts.all++;typeCounts[e.t]++;}});
  elTypes.innerHTML=[`<button class="chip${state.type==="all"?" on":""}" data-type="all" aria-pressed="${state.type==="all"}">All types <span class="n">${typeCounts.all}</span></button>`]
    .concat(Object.entries(TYPES).map(([id,t])=>`<button class="chip${state.type===id?" on":""}" data-type="${id}" aria-pressed="${state.type===id}" style="--c:${t.v}"><span class="dot"></span>${t.l} <span class="n">${typeCounts[id]}</span></button>`)).join("");

  const title=state.cat==="all"?"Unreal Debug Kit":CAT_LABEL[state.cat];
  const sub=state.cat==="all"?"Console commands, profiling workflows, debugging tools and the fixes for the errors you keep seeing — for Unreal Engine 5, in one searchable place.":"";
  elHero.innerHTML=`<h1>${title}</h1>${sub?`<p>${sub}</p>`:""}${PRIMERS[state.cat]?`<div class="primer">${PRIMERS[state.cat]}</div>`:""}`;

  const total=DATA.length;
  const where=[state.cat!=="all"?CAT_LABEL[state.cat]:null,state.type!=="all"?TYPES[state.type].l:null].filter(Boolean).join(" · ");
  elMeta.innerHTML=`<span>${scored.length} of ${total} entries${where?" — "+esc(where):""}${state.q?` matching “${esc(state.q)}”`:""}</span>${toks.length?"<span>sorted by relevance</span>":""}`;

  if(!scored.length){
    elList.innerHTML="";
    const hint=state.q?`Nothing matches <strong>“${esc(state.q)}”</strong>${where?" in "+esc(where):""}. Try a shorter word — <em>stat</em>, <em>trace</em>, <em>replicat</em>, <em>navmesh</em> — or search everything.`:"No entries here with the current filters.";
    elList.insertAdjacentHTML("afterend",`<div class="empty" id="empty">${hint}<br><button type="button" id="reset">Clear search and filters</button></div>`);
    return;
  }
  const old=$("#empty");if(old)old.remove();

  elList.innerHTML=scored.map(({e,i})=>{
    const t=TYPES[e.t];
    const cmd=e.k?`<div class="cmd">${highlight(esc(e.k),re)}<button class="copy" type="button" data-copy="${i}" aria-label="Copy to clipboard">copy</button></div>`:"";
    const tags=(e.g&&e.g.length)?`<div class="tags">${e.g.map(g=>`<button class="tag" type="button" data-tag="${esc(g)}">${highlight(esc(g),re)}</button>`).join("")}</div>`:"";
    return `<li class="item" style="--tc:${t.v}">
      <div class="item-h"><span class="type">${t.l}</span><h3>${highlight(esc(e.n),re)}</h3><button class="catlink" type="button" data-cat="${e.c}">${CAT_LABEL[e.c]}</button></div>
      ${cmd}<p>${highlight(inlineCode(esc(e.d)),re)}</p>${tags}</li>`;
  }).join("");
}

function setHash(){
  const p=new URLSearchParams();
  if(state.cat!=="all")p.set("cat",state.cat);
  if(state.type!=="all")p.set("type",state.type);
  if(state.q)p.set("q",state.q);
  const h=p.toString();
  try{history.replaceState(null,"",h?"#"+h:location.pathname+location.search);}catch(e){}
}
function readHash(){
  try{
    const p=new URLSearchParams(location.hash.replace(/^#/,""));
    const c=p.get("cat"),t=p.get("type"),q=p.get("q");
    if(c&&CAT_LABEL[c])state.cat=c;
    if(t&&(t==="all"||TYPES[t]))state.type=t;
    if(q){state.q=q;elQ.value=q;}
  }catch(e){}
}
function update(){render();setHash();}

let timer=null;
elQ.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>{state.q=elQ.value.trim();update();},70);});
elQ.addEventListener("keydown",e=>{if(e.key==="Escape"){elQ.value="";state.q="";update();elQ.blur();}});
$("#clear").addEventListener("click",()=>{elQ.value="";state.q="";update();elQ.focus();});
$("#home").addEventListener("click",()=>{state.cat="all";state.type="all";state.q="";elQ.value="";update();window.scrollTo({top:0});});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&!/^(input|textarea|select)$/i.test(document.activeElement.tagName)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();elQ.focus();elQ.select();}
});

document.addEventListener("click",async e=>{
  const cat=e.target.closest("[data-cat]");
  if(cat){state.cat=cat.dataset.cat;update();if(cat.classList.contains("catlink"))window.scrollTo({top:0,behavior:"smooth"});return;}
  const type=e.target.closest("[data-type]");
  if(type){state.type=type.dataset.type;update();return;}
  const tag=e.target.closest("[data-tag]");
  if(tag){state.q=tag.dataset.tag;elQ.value=state.q;state.cat="all";update();window.scrollTo({top:0,behavior:"smooth"});return;}
  const reset=e.target.closest("#reset");
  if(reset){state.cat="all";state.type="all";state.q="";elQ.value="";update();elQ.focus();return;}
  const copy=e.target.closest("[data-copy]");
  if(copy){
    const text=DATA[+copy.dataset.copy].k;
    const ok=await copyText(text);
    copy.textContent=ok?"copied":"select it";
    copy.classList.toggle("ok",ok);
    setTimeout(()=>{copy.textContent="copy";copy.classList.remove("ok");},1400);
  }
});

async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true;}catch(e){}
  try{const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;opacity:0;top:0;left:0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();return ok;}catch(e){return false;}
}

// theme: auto → light → dark, remembered per viewer
const themeBtn=$("#theme");
const THEMES=["auto","light","dark"];
function applyTheme(t){
  if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);
  themeBtn.textContent=t==="auto"?"auto":t;
  themeBtn.setAttribute("aria-label","Color theme: "+t+". Click to change");
}
let theme="auto";
try{const s=localStorage.getItem("udk-theme");if(THEMES.includes(s))theme=s;}catch(e){}
applyTheme(theme);
themeBtn.addEventListener("click",()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%THEMES.length];applyTheme(theme);try{localStorage.setItem("udk-theme",theme);}catch(e){}});

readHash();
render();
window.addEventListener("hashchange",()=>{readHash();render();});
})();
</script>
</body>
